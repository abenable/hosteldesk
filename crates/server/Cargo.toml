[package]
name = "server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# cdylib is the Worker (wasm32, built by worker-build); rlib is for native tests
# and for the desk's two-desk test, which serves MemoryStore over TCP.
crate-type = ["cdylib", "rlib"]

[features]
# Sign leases with the dev license key when no HOSTELDESK_SIGNING_KEY is set. Off by default.
dev-license = []

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = { workspace = true }
ed25519-dalek = "2"
hex = "0.4"
password-hash = { version = "0.5", features = ["std", "getrandom"] }
protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
worker = { version = "0.9", features = ["d1"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
