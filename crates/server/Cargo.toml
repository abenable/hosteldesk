[package]
name = "server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# cdylib is the Worker (wasm32, built by worker-build); rlib is for native tests
# and for the desk's two-desk test, which serves MemoryStore over TCP.
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = "0.5"
chrono = { workspace = true }
hex = "0.4"
password-hash = { version = "0.5", features = ["std", "getrandom"] }
protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
worker = { version = "0.9", features = ["tokio-postgres"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
