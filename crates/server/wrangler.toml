# HostelDesk sync API on Cloudflare Workers (Rust → wasm via worker-build).
# Data lives in Neon Postgres, reached through Hyperdrive (connection pooling).
#
# Deploy:  scripts/deploy-worker.sh   (migrates the Neon database, then deploys)
# Local:   see docs/DEVELOPMENT.md (local Postgres via
#          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE)
# Needs the Workers Paid plan: Argon2 sign-in exceeds the Free plan's 10 ms CPU limit.
name = "hosteldesk-sync"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-15"
account_id = "7db8ddd2e4eb60dc49a3c644f70e2908"

[build]
command = "cargo install -q worker-build --version ^0.9 && worker-build --release"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b80b36213545415cbd9dfe22977ed168"

[observability]
enabled = true
