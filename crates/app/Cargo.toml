[package]
name = "app"
version = "1.0.0"
edition = "2021"
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Forwarded to license/dev-license. Pass --features dev-license to
# `cargo tauri dev` / `cargo build` to activate with a license minted by
# license/examples/generate_dev_license.rs. Off by default, including for
# `cargo tauri build --debug`, so a shippable build can never accept one.
dev-license = ["license/dev-license"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
db = { path = "../db" }
hosteldesk-core = { path = "../core" }
license = { path = "../license" }
open = "5"
pdf = { path = "../pdf" }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2", features = ["image-png", "test"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
