name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: '1.100.0'
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Before any cargo step: the app crate embeds frontend/dist at compile time.
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Install Linux system dependencies (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (sync Worker, wasm32)
        run: cargo clippy -p server --target wasm32-unknown-unknown -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # The release builds the Windows installer only on a tag; this runs the same
  # script on a real Windows runner for every PR (with a placeholder exe).
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: bash
        run: |
          mkdir -p target/release && printf 'placeholder' > target/release/hosteldesk.exe
          packaging/windows/build-installer.sh 0.0.0 "$RUNNER_TEMP/installer-check.exe"
          test -s "$RUNNER_TEMP/installer-check.exe"
