name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: '1.94.0'
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libwayland-dev \
            libssl-dev

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (sync Worker, wasm32)
        run: cargo clippy -p server --target wasm32-unknown-unknown -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # The release builds the Windows installer only on a tag; this runs the same
  # script on a real Windows runner for every PR (with a placeholder exe).
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: bash
        run: |
          mkdir -p target/release && : > target/release/hosteldesk.exe
          packaging/windows/build-installer.sh 0.0.0 "$RUNNER_TEMP/installer-check.exe"
          test -s "$RUNNER_TEMP/installer-check.exe"
