name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="${RELEASE_TAG}" \
            -f name="HostelDesk ${RELEASE_TAG}" \
            -f body="Installers for HostelDesk. Download the bundle for your platform." \
            -F draft=true \
            -F prerelease=false \
            --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            checksum_name: checksums-linux.txt
          - platform: windows-latest
            checksum_name: checksums-windows.txt

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: '1.94.0'

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libwayland-dev \
            libssl-dev

      - name: Install NSIS
        if: matrix.platform == 'windows-latest'
        run: choco install nsis -y

      - name: Build release binary
        run: cargo build --release -p app

      - name: Package Linux deb
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh "$RUNNER_TEMP/HostelDesk.deb"
          echo "ARTIFACT=$RUNNER_TEMP/HostelDesk.deb" >> "$GITHUB_ENV"

      - name: Package Windows installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          outfile="$RUNNER_TEMP/HostelDesk_${version}_x64-setup.exe"
          packaging/windows/build-installer.sh "$version" "$outfile"
          echo "ARTIFACT=$outfile" >> "$GITHUB_ENV"

      - name: Publish checksum and installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checksum_file="${{ matrix.checksum_name }}"
          sha256sum "$ARTIFACT" > "$checksum_file"
          gh release upload "$RELEASE_TAG" "$ARTIFACT" "$checksum_file" --clobber --repo "${{ github.repository }}"

  publish-release:
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false
