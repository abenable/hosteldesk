[workspace]
members = ["crates/app", "crates/core", "crates/db", "crates/pdf", "crates/protocol", "crates/server"]
resolver = "2"

[workspace.package]
version = "2.1.3"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/abenable/hosteldesk"
authors = ["Able Abenaitwe <ableabenaitwe@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.36"
thiserror = "2"
tracing = "0.1"
# One sqlx for crates/db and crates/app: both link libsqlite3-sys, which allows one version.
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
argon2 = "0.6"
getrandom = "0.4"

[profile.release]
opt-level = 3
lto = true
